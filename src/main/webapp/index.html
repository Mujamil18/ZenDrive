/* Filter dropdown styling */
.filter-container {
display: flex;
align-items: center;
position: relative;
}

.filter-label {
margin-right: 10px;
font-size: 14px;
color: #616161;
}

.filter-dropdown {
width:70%;
padding: 8px;
border-radius: 4px;
border:none;
background-color: #fff;
font-size: 17px;
color: #333;
cursor: pointer;
position: relative;
z-index: 10; /* Ensures the dropdown is clickable */
}

.filter-dropdown:focus {
outline: none;
border-color: #616161;
}

/* Dropdown visibility */
.dropdown {
display: none;
position: absolute;
background-color: #fff;
border-radius: 4px;
box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
max-height: 200px;
overflow-y: auto;
width: 300px;
top: 50px;
z-index: 5; /* Ensure the dropdown is clickable and appears above other elements */
}

/* Voice button */
.voice-btn {
background-color: transparent;
border: none;
border-radius: 50%;
cursor: pointer;
z-index: 10;
height: 40px;
cursor: pointer;
transition-duration: .3s;

}



@media (max-width: 768px) {
#dropdown {
    width: calc(100% - 20px); /* Make dropdown fit within small screens with a little padding */
}

.dropdown-item {
    font-size: 12px;    /* Smaller font size for mobile */
    padding: 8px;       /* Reduce padding on small screens */
}
}

@media (max-width: 480px) {
#dropdown {
    max-height: 150px;  /* Limit the height on very small screens */
}
}

/* Chatbot Container */
#chatbot {
    position: fixed;
    bottom: 20px;
    right: 15px;
    width: 27%; /* Reduced from 420px */
    height: 50vh; /* Reduced from 600px */
    background: #ffffff;
    border-radius: 16px; /* Slightly reduced radius */
    display: none;
    flex-direction: column;
    z-index: 1000;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    border: 1px solid rgba(0, 0, 0, 0.05);
}

/* Header linear-gradient(135deg, #ff9822, #ffbe73) */
.header {
    background: black ;
    color: white;
    padding: 12px 16px; /* Reduced padding */
    font-size: 16px; /* Smaller font */
    font-weight: 600;
    text-align: center;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

/* Close Button */
.close-btn {
    font-size: 20px; /* Smaller font */
    cursor: pointer;
    transition: 0.3s;
    width: 28px; /* Smaller size */
    height: 28px; /* Smaller size */
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
}

.close-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: rotate(90deg);
}

/* Chat Box */
.chat-box {
    flex: 1;
    /* height: 100%; */
    padding: 16px; /* Reduced padding */
    font-size:22px;
    background: #f8fafc;
    border-bottom-left-radius: 16px;
    border-bottom-right-radius: 16px;
    overflow-y: auto;
    height: 40vh; /* Adjusted for smaller header */
    scroll-behavior: smooth;
}

/* Custom Scrollbar */
.chat-box::-webkit-scrollbar {
    width: 4px; /* Thinner scrollbar */
}

.chat-box::-webkit-scrollbar-track {
    background: transparent;
}

.chat-box::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 2px;
}

/* Messages */
.message {
    display: flex;
    align-items: flex-end;
    margin-bottom: 12px; /* Reduced margin */
    font-size: 0.7em; /* Smaller font */
    line-height: 1.4;
    gap: 0.5em;
    animation: fadeIn 0.4s ease-out;
}
.profile-img{
    margin-top: 25px;
    width: 50px;
    border-radius: 50%;
}
.sent {
    justify-content: flex-end;
}

.received {
    justify-content: flex-start;
}

.message span {
    max-width: 220px; /* Reduced max-width */
    margin-bottom: 15px;;
    word-wrap: break-word;
    padding: 10px 14px; /* Reduced padding */
    border-radius: 14px; /* Slightly reduced radius */
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
}

.sent span {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    margin-left: 8px; /* Reduced margin */
    border-bottom-right-radius: 4px;
}

.received span {
    background: white;
    color: #1e293b;
    margin-right: 8px; /* Reduced margin */
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(0, 0, 0, 0.05);
}

/* Input & Buttons */
.searchBar {
    display: flex;
    align-items: center;
    gap: 8px; /* Reduced gap */
    padding: 12px 16px; /* Reduced padding */
    width: 100%;
    position: absolute;
    bottom: 0;
    background: white;
    border-bottom-left-radius: 16px;
    border-bottom-right-radius: 16px;
    box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.03);
    border-top: 1px solid rgba(0, 0, 0, 0.05);
}

/* Input Field */
#inputText {
    flex: 1;
    border: 2px solid #e2e8f0;
    padding: 12px; /* Reduced padding */
    font-size: 14px; /* Smaller font */
    color: #1e293b;
    outline: none;
    border-radius: 12px; /* Slightly reduced radius */
    transition: all 0.3s ease;
    background: #f8fafc;
}

#inputText:focus {
    border-color: #2563eb;
    background: white;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.1);
}

#inputText::placeholder {
    color: #94a3b8;
}

/* Stop Button */
#stopButton {
    background: #f1f5f9;
    border: none;
    height: 32px; /* Smaller size */
    width: 32px; /* Smaller size */
    border-radius: 10px; /* Slightly reduced radius */
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    color: #64748b;
}

#stopButton:hover {
    background: #fee2e2;
    color: #ef4444;
}

/* Send & Voice Buttons */
.send-voice {
    display: flex;
    align-items: center;
    gap: 6px; /* Reduced gap */
}

.send-btn, .voice-btn {
    width: 32px; /* Smaller size */
    height: 32px; /* Smaller size */
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px; /* Smaller font */
    cursor: pointer;
    transition: all 0.3s ease;
    border-radius: 10px; /* Slightly reduced radius */
}

.send-btn {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
}

.voice-btn:hover {
    color: white;
}

/* File Info */
.file-info {
    display: flex;
    flex-direction: column;
    gap: 6px; /* Reduced gap */
    padding: 10px; /* Reduced padding */
    border-radius: 10px; /* Slightly reduced radius */
}

.file-size {
    color: #64748b;
    font-size: 12px; /* Smaller font */
}

/* Clear Button */
button.clear {
    background: #ef4444;
    color: white;
    border: none;
    border-radius: 10px; /* Slightly reduced radius */
    width: 32px; /* Smaller size */
    height: 32px; /* Smaller size */
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.3s ease;
    margin: 12px; /* Reduced margin */
}

button.clear:hover {

.card {
/* color used to softly clip top and bottom of the .words container */
--bg-color: transparent;
background-color: var(--bg-color);
padding: 1rem 2rem;
border-radius: 1.25rem;
}
.loader {
color: rgb(124, 124, 124);
font-family: "Poppins", sans-serif;
font-weight: 500;
font-size: 25px;
-webkit-box-sizing: content-box;
box-sizing: content-box;
height: 40px;
padding: 10px 10px;
display: -webkit-box;
display: -ms-flexbox;
display: flex;
border-radius: 8px;
}

.words {
overflow: hidden;
position: relative;
}
.words::after {
content: "";
position: absolute;
inset: 0;
background: linear-gradient(
var(--bg-color) 10%,
transparent 30%,
transparent 70%,
var(--bg-color) 90%
);
z-index: 20;
}

.word {
display: block;
height: 100%;
padding-left: 6px;
font-size:32px;
color: black;
animation: spin_4991 4s infinite;
}

@keyframes spin_4991 {
10% {
-webkit-transform: translateY(-102%);
transform: translateY(-102%);
}

25% {
-webkit-transform: translateY(-100%);
transform: translateY(-100%);
}

35% {
-webkit-transform: translateY(-202%);
transform: translateY(-202%);
}

50% {
-webkit-transform: translateY(-200%);
transform: translateY(-200%);
}

60% {
-webkit-transform: translateY(-302%);
transform: translateY(-302%);
}

75% {
-webkit-transform: translateY(-300%);
transform: translateY(-300%);
}

85% {
-webkit-transform: translateY(-402%);
transform: translateY(-402%);
}

100% {
-webkit-transform: translateY(-400%);
transform: translateY(-400%);
}

                    class CircularProgressBar {

                        constructor(element) {
                        this.element = element;

                        this.segments = [

                        { type: 'Image', color: '#f2c5c5', value: 25 },

                        this.initialize();

                        initialize() {
                        const container = document.createElement('div');
                        container.className = 'progress-container';

                        const radius = 110;
                        this.circumference = 2 * Math.PI * radius;

                        container.innerHTML = `
                            <svg class="progress-circle" width="250" height="250" viewBox="0 0 250 250">

                            </div>
                        `;

                        this.element.appendChild(container);
                        this.initializeProgress();
                        }

                        createSegmentPaths(radius) {
                        const totalValue = this.segments.reduce((sum, segment) => sum + segment.value, 0);
                        let currentAngle = 0;

                        return this.segments.map((segment) => {
                            const percentage = segment.value / totalValue;
                            const angle = percentage * 360;
                            const startAngle = currentAngle;
                            currentAngle += angle;

                            const path = this.describeArc(125, 125, radius, startAngle, currentAngle);

                            return `
                            <path
                                class="progress-segment"
                                d="${path}"
                                stroke="${segment.color}"
                                stroke-width="25"
                                fill="none"
                                stroke-linecap="round"
                            />
                            `;
                        }).join('');
                        }

                        describeArc(x, y, radius, startAngle, endAngle) {
                        const start = this.polarToCartesian(x, y, radius, endAngle);
                        const end = this.polarToCartesian(x, y, radius, startAngle);
                        const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";

                        return [
                            "M", start.x, start.y,
                            "A", radius, radius, 0, largeArcFlag, 0, end.x, end.y
                        ].join(" ");
                        }

                        polarToCartesian(centerX, centerY, radius, angleInDegrees) {
                        const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
                        return {
                            x: centerX + (radius * Math.cos(angleInRadians)),
                            y: centerY + (radius * Math.sin(angleInRadians))
                        };
                        }

    function handleFileUpload(event) {
        console.log("hello");
        const formData = new FormData();
        const files = event.target.files;

        for (let file of files) {
            formData.append('file', file); // This correctly appends each file

            // Handle file types and categorization (optional part)
            const extension = '.' + file.name.split('.').pop().toLowerCase();
            let fileType = null;

                if (extensions.includes(extension)) {

// Function to extract keyword from the Flask API
function extractKeyword(query) {
    // Process the query using Compromise
    const doc = nlp(query);

    // Extract the nouns (potential keywords)
    const keywords = doc.nouns().out('array');

    // List of common words/phrases to ignore in the extraction
    const ignoreList = [
        'image', 'images', 'photo', 'photos', 'show', 'me', 'the', 'containing',
        'of', 'in', 'on', 'for', 'with', 'this', 'a', 'an', 'and', 'to', 'it', 'that',
        'is', 'are', 'please', 'search', 'find', 'showing', 'view', 'display', 'looking'
    ];

    // Filter out common or irrelevant words from the extracted keywords
    const filteredKeywords = keywords.filter(keyword => !ignoreList.includes(keyword.toLowerCase()));

    // Return the first valid keyword, or null if no valid keyword found
    return filteredKeywords.length > 0 ? filteredKeywords[0] : null;
}

    function initializeCodeEditor(file) {
        const modeMap = {
            javascript: 'javascript',
            html: 'xml',
            css: 'css',
            python: 'python',
            java: 'text/x-java',
            cpp: 'text/x-c++src',
            c: 'text/x-csrc',
            csharp: 'text/x-csharp'
        };

        editor = CodeMirror(document.getElementById('code-editor'), {
            mode: modeMap[file.type] || 'javascript',
            theme: 'monokai',
            lineNumbers: true,
            autoCloseBrackets: true,
            matchBrackets: true,
            indentUnit: 4,
            tabSize: 4,
            lineWrapping: true,
            value: file.content || ''
        });

        const runButton = document.getElementById('run-code');
        const saveButton = document.getElementById('save-code');
        const outputDiv = document.getElementById('code-output');
        const clearButton = document.getElementById('clear-output');

        runButton.addEventListener('click', () => {
            const code = editor.getValue();
            outputDiv.innerHTML = '';

            try {
                if (file.type === 'javascript') {
                    const originalLog = console.log;
                    const logs = [];
                    console.log = function() {
                        logs.push(Array.from(arguments).join(' '));
                        originalLog.apply(console, arguments);
                    };
                    const result = eval(code);
                    console.log = originalLog;

                    if (logs.length > 0) {
                        outputDiv.innerHTML += logs.join('\n') + '\n';
                    }
                    if (result !== undefined) {
                        outputDiv.innerHTML += '=> ' + result;
                    }
                } else if (file.type === 'html') {
                    outputDiv.innerHTML = code;
                } else if (file.type === 'css') {
                    const style = document.createElement('style');
                    style.textContent = code;
                    outputDiv.innerHTML = '';
                    outputDiv.appendChild(style);
                    outputDiv.innerHTML += '<div class="css-preview">CSS Preview Area</div>';
                } else {
                    outputDiv.innerHTML = `Code execution for ${file.type} is not supported in the browser.\nConsider using a backend service for compilation and execution.`;
                 }
            } catch (error) {
                outputDiv.innerHTML = `Error: ${error.message}`;
            }
        });

        saveButton.addEventListener('click', () => {
            const newContent = editor.getValue();
            const blob = new Blob([newContent], { type: 'text/plain' });
            const newFile = new File([blob], file.name, { type: 'text/plain' });
            const formData = new FormData();
            formData.append('file', newFile);

            fetch('/WorkdrivePlusPlus/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                outputDiv.innerHTML = 'File saved successfully!';

                    ...file,
                    content: newContent
                });
            })
            .catch(error => {
                outputDiv.innerHTML = `Error saving file: ${error.message}`;
            });
        });

        clearButton.addEventListener('click', () => {
            outputDiv.innerHTML = '';
        });
    }

    function formatFileSize(bytes) {
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
        if (bytes === 0) return '0 Byte';
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + sizes[i];
    }

    function getFileTypeIcon(type) {
        const iconMap = {
            'application/pdf': '<i class="fas fa-file-pdf"></i>',
            'application/msword': '<i class="fas fa-file-word"></i>',
            'application/vnd.openxmlformats-officedocument.wordprocessingml.document': '<i class="fas fa-file-word"></i>',
            'application/vnd.ms-excel': '<i class="fas fa-file-excel"></i>',
            'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': '<i class="fas fa-file-excel"></i>',
            'application/vnd.ms-powerpoint': '<i class="fas fa-file-powerpoint"></i>',
            'application/vnd.openxmlformats-officedocument.presentationml.presentation': '<i class="fas fa-file-powerpoint"></i>',
            'text/plain': '<i class="fas fa-file-alt"></i>',
            'audio/': '<i class="fas fa-file-audio"></i>',
            'application/json': '<i class="fas fa-file-code"></i>',
            'text/html': '<i class="fas fa-file-code"></i>',
            'text/css': '<i class="fas fa-file-code"></i>',
            'text/javascript': '<i class="fas fa-file-code"></i>',
        };

        // Check for exact matches
        if (iconMap[type]) {
            return iconMap[type];
        }

        // Check for partial matches (e.g., audio/*)
        for (const [key, icon] of Object.entries(iconMap)) {
            if (type.startsWith(key)) {
                return icon;
            }
        }

        // Default icon
        return '<i class="fas fa-file"></i>';
    }

     recognition.lang = 'en-US';
     recognition.interimResults = true;

     // Timer for debounce
     let debounceTimer;

     // Debounce function to delay search requests
     function debounce(func, delay) {
         return function () {
             clearTimeout(debounceTimer);
             debounceTimer = setTimeout(func, delay);
         };
     }

     const query = searchInput.value.trim();


     // Function to handle search query input and display dropdown
     function searchInputEvent() {
         const query = searchInput.value.trim();

     // Start event: Speech recognition has started
     recognition.onstart = function () {
         console.log("Speech recognition started...");
     };

     // Result event: Speech input detected and text is added to search box
     recognition.onresult = function (event) {
         const transcript = event.results[event.results.length - 1][0].transcript;
         console.log("Recognized Speech:", transcript);
         searchInput.value = transcript;

         // As you speak, initiate search request with debounce

     recognition.onend = function () {

             searchButton.click(); // Trigger search if query exists
         }
     };

     // Function to handle Text-to-Speech
     let currentSpeech = null;



function speak(message) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop any ongoing speech

        currentSpeech = new SpeechSynthesisUtterance(message);

        // Get available voices (sometimes loads asynchronously)
        let voices = window.speechSynthesis.getVoices();

        if (voices.length === 0) {
            window.speechSynthesis.onvoiceschanged = function () {
                voices = window.speechSynthesis.getVoices();
                setBestVoiceAndSpeak(currentSpeech, voices, message);
            };
        } else {
            setBestVoiceAndSpeak(currentSpeech, voices, message);
        }
    } else {
        console.error('Speech synthesis is not supported in this browser.');
    }
}

function setBestVoiceAndSpeak(speech, voices, message) {
    console.log("Available Voices:", voices);

    // Prioritize high-quality English voices
    const preferredVoices = [
        "Google UK English Female",
        "Google UK English Male",
        "Google US English",
        "Microsoft Zira - English (United States)",
        "Microsoft David - English (United States)",
        "Google English"
    ];

    let bestVoice = voices.find(voice =>
        preferredVoices.includes(voice.name)
    ) || voices.find(voice => voice.lang.includes('en')) || voices[0];

    // Apply the best voice found
    speech.voice = bestVoice;
    speech.lang = bestVoice.lang;
    speech.pitch = 1.0; // Natural pitch
    speech.rate = 1.0;  // Normal speed
    speech.volume = 1.0; // Full volume

    console.log(`Using voice: ${bestVoice.name} (${bestVoice.lang})`);

    window.speechSynthesis.speak(speech);

    speech.onend = function () {
        console.log('Speech has finished.');
    };

    speech.onerror = function (event) {
        console.error("Error during speech synthesis:", event.error);
    };
}
